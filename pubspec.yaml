    sdk: flutter

  cupertino_icons: ^1.0.8

  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  qr_flutter: ^4.1.0
  installed_apps: ^2.1.1
  permission_handler: ^12.0.3
