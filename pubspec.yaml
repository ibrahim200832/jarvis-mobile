  flutter_svg: ^2.3.0
  battery_plus: ^6.2.1
  web: ^1.1.0
  google_sign_in: ^6.2.2
  image_picker: ^1.2.3
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^22.3.0
