<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#241d15"/>
      <stop offset="100%" stop-color="#120f0c"/>
    </radialGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c674"/>
      <stop offset="100%" stop-color="#e3a552"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="23" fill="none" stroke="#e3a552" stroke-opacity="0.18" stroke-width="2"/>

  <!-- snake body: rounded blocks forming an S, same visual language as the in-game grid cells -->
  <rect x="20" y="20" width="22" height="22" rx="6" fill="url(#body)" opacity="0.55"/>
  <rect x="20" y="44" width="22" height="22" rx="6" fill="url(#body)" opacity="0.75"/>
  <rect x="44" y="44" width="22" height="22" rx="6" fill="url(#body)" opacity="0.9"/>
  <rect x="68" y="44" width="22" height="22" rx="6" fill="url(#body)"/>
  <rect x="68" y="68" width="22" height="22" rx="6" fill="url(#body)"/>

  <!-- head -->
  <rect x="68" y="92" width="22" height="22" rx="7" fill="#f0c674"/>
  <circle cx="83" cy="99" r="2.4" fill="#241a0e"/>

  <!-- food dot for a bit of scene-setting -->
  <circle cx="30" cy="99" r="5" fill="#d6533a"/>
</svg>
