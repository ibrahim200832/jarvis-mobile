name: Test Snake Multiplayer Live Connectivity

on:
  push:
    branches: [claude/game-code-pyet6p]
    paths:
      - '.github/workflows/test-snake-multiplayer.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Connect two real clients to the live server and play a round
        run: |
          node --input-type=module -e "
          const BASE = 'wss://snake-multiplayer.ibrahimcool2818.workers.dev';

          function connect(url) {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(url);
              ws.addEventListener('open', () => resolve(ws));
              ws.addEventListener('error', () => reject(new Error('connection failed: ' + url)));
            });
          }

          function waitFor(ws, type, timeoutMs = 8000) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error('timeout waiting for ' + type)), timeoutMs);
              function handler(evt) {
                const msg = JSON.parse(evt.data);
                if (msg.type === type) {
                  clearTimeout(timer);
                  ws.removeEventListener('message', handler);
                  resolve(msg);
                }
              }
              ws.addEventListener('message', handler);
            });
          }

          async function main() {
            console.log('Connecting host to', BASE);
            const host = await connect(BASE + '/create?name=CI-Host&max=2');
            const welcome = await waitFor(host, 'welcome');
            console.log('Host got room code:', welcome.code);

            console.log('Connecting guest via code', welcome.code);
            const guest = await connect(BASE + '/join/' + welcome.code + '?name=CI-Guest');
            await waitFor(guest, 'welcome');

            const hostLobby = await waitFor(host, 'lobby');
            console.log('Host sees players:', hostLobby.players.map((p) => p.name).join(', '));
            if (hostLobby.players.length !== 2) throw new Error('expected 2 players, got ' + hostLobby.players.length);

            host.send(JSON.stringify({ type: 'start' }));
            const hostStart = await waitFor(host, 'start');
            await waitFor(guest, 'start');
            console.log('Game started, board', hostStart.cols + 'x' + hostStart.rows);

            await waitFor(host, 'state');
            await waitFor(guest, 'state');
            console.log('Both clients received live game state from the server.');

            host.close();
            guest.close();
            console.log('SUCCESS: real create -> join -> start -> state round-trip over the internet worked.');
          }

          main().catch((e) => {
            console.error('FAILURE:', e.message);
            process.exit(1);
          });
          "
