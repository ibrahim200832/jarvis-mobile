name: Build Adventure APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'adventure-game/android/**'
      - '.github/workflows/build-adventure-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate launcher icons from logo
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="adventure-game/android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" adventure-game/icon.svg -o "$dir/ic_launcher.png"
          done

      - name: Build debug APK
        working-directory: adventure-game/android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: adventure-game-apk
          path: adventure-game/android/app/build/outputs/apk/debug/app-debug.apk

      # Actions artifacts live on Azure Blob Storage, which some sandboxed
      # tooling can't reach directly, so also commit the APK straight into
      # the repo for a plain git/raw-file download path.
      - name: Publish built APK to repo
        run: |
          mkdir -p adventure-game/android/dist
          cp adventure-game/android/app/build/outputs/apk/debug/app-debug.apk adventure-game/android/dist/adventure-game-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adventure-game/android/dist/adventure-game-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built adventure-game APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
