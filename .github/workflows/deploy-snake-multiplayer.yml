name: Deploy Snake Multiplayer Worker

on:
  push:
    branches: [main]
    paths:
      - 'snake-game/worker/**'
      - 'snake-game/index.html'
      - 'snake-game/style.css'
      - 'snake-game/script.js'
      - 'snake-game/multiplayer.js'
      - 'snake-game/auth-client.js'
      - 'snake-game/icon.svg'
      - '.github/workflows/deploy-snake-multiplayer.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Fehlt eines der Secrets CLOUDFLARE_API_TOKEN oder CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions). Danach diesen Workflow erneut manuell ausfuehren."
            exit 1
          fi
          if [ -z "$AUTH_JWT_SECRET" ]; then
            echo "::error::Fehlt das Secret AUTH_JWT_SECRET (z.B. per 'openssl rand -hex 32' erzeugen und unter Settings > Secrets and variables > Actions eintragen)."
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET fehlen - Google-Anmeldung ist deaktiviert, bis diese Secrets gesetzt sind."
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY fehlt - Bestaetigungs-Mails werden nur in den Worker-Logs ausgegeben statt wirklich verschickt."
          fi

      - name: Install wrangler
        working-directory: snake-game/worker
        run: npm install --no-save wrangler@3.90.0

      - name: Prepare static assets
        run: |
          mkdir -p snake-game/worker/public
          cp snake-game/index.html snake-game/style.css snake-game/script.js snake-game/multiplayer.js snake-game/auth-client.js snake-game/icon.svg snake-game/worker/public/

      - name: Ensure D1 database exists
        working-directory: snake-game/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LIST_JSON=$(npx wrangler d1 list --json)
          DB_ID=$(echo "$LIST_JSON" | jq -r '((.result // .) | map(select(.name=="snake-auth")) | .[0].uuid) // empty')
          if [ -z "$DB_ID" ]; then
            echo "Creating snake-auth D1 database..."
            CREATE_JSON=$(npx wrangler d1 create snake-auth --json)
            DB_ID=$(echo "$CREATE_JSON" | jq -r '(.result.uuid // .uuid)')
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::Konnte die D1-Datenbank-ID nicht ermitteln."
            exit 1
          fi
          echo "D1 database id: $DB_ID"
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        working-directory: snake-game/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute snake-auth --remote --file=schema.sql -y

      - name: Set Worker secrets
        working-directory: snake-game/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET

          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          fi
          if [ -n "$RESEND_FROM_EMAIL" ]; then
            printf '%s' "$RESEND_FROM_EMAIL" | npx wrangler secret put RESEND_FROM_EMAIL
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: snake-game/worker
