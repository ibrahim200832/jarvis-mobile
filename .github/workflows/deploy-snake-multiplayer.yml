name: Deploy Snake Multiplayer Worker

on:
  push:
    branches: [main]
    paths:
      - 'snake-game/worker/**'
      - '.github/workflows/deploy-snake-multiplayer.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Fehlt eines der Secrets CLOUDFLARE_API_TOKEN oder CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions). Danach diesen Workflow erneut manuell ausfuehren."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: snake-game/worker
