name: Deploy AI Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Fehlt eines der Secrets CLOUDFLARE_API_TOKEN oder CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions). Danach diesen Workflow erneut manuell ausfuehren."
            exit 1
          fi

      - name: Install wrangler
        run: npm install --no-save wrangler@3.90.0

      - name: Ensure D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LIST_JSON=$(npx wrangler d1 list --json)
          DB_ID=$(echo "$LIST_JSON" | jq -r '((.result // .) | map(select(.name=="jarvis-telemetry")) | .[0].uuid) // empty')
          if [ -z "$DB_ID" ]; then
            echo "Creating jarvis-telemetry D1 database..."
            CREATE_JSON=$(npx wrangler d1 create jarvis-telemetry --json)
            DB_ID=$(echo "$CREATE_JSON" | jq -r '(.result.uuid // .uuid)')
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::Konnte die D1-Datenbank-ID nicht ermitteln."
            exit 1
          fi
          echo "D1 database id: $DB_ID"
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute jarvis-telemetry --remote --file=worker/schema.sql -y

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
