name: APK Release Temp

# Temporary, throwaway workflow: re-packages an already-built APK from a
# prior "Build APK" run as a GitHub Release asset, so it can be downloaded
# from a CDN host reachable outside GitHub's own artifact storage. Not part
# of the app - delete this file (and the branch it lives on) once the
# delivery is done.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build APK workflow run ID to fetch the artifact from'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-mobile-apk
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-delivery-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "Temporary APK delivery" \
            --notes "Temporary release for delivering a build; safe to delete." \
            app-release.apk
