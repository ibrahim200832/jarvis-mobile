name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Same commit-count based numbering as deploy-web.yml (not
      # github.run_number, which is a separate per-workflow counter) so an
      # APK built here reports a version UpdateService can correctly compare
      # against the one in deploy-web.yml's version.json.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Generate launcher icons from logo
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" assets/icon/logo.svg -o "$dir/ic_launcher.png"
          done

      - name: Set up Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/jarvis-release.jks
            cat > android/key.properties <<EOF
          storeFile=jarvis-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=jarvis
          EOF
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release --build-name=1.0.${{ env.BUILD_NUMBER }} --build-number=${{ env.BUILD_NUMBER }}

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Publish the APK as a GitHub Release asset rather than an Actions
      # artifact or a repo commit: Actions-artifact downloads (Azure Blob
      # Storage, productionresultssa*.blob.core.windows.net) are blocked
      # from the dev sandbox's proxy, and the APK (180MB+, driven up by the
      # bundled offline-AI native libraries — see Runde 13) now exceeds
      # GitHub's 100MB per-file commit limit. Release assets are served
      # from a different host (release-assets.githubusercontent.com, up to
      # 2GB per asset) that IS reachable from the sandbox, and don't bloat
      # the git history the way committing a large binary would.
      - name: Publish built APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-build-${{ env.BUILD_NUMBER }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "JARVIS APK Build ${{ env.BUILD_NUMBER }}" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
