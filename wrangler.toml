name = "jarvis-ai"
main = "worker/ai-proxy.js"
compatibility_date = "2024-11-01"

[ai]
binding = "AI"

# Stores the Google Calendar refresh token + reminder phone number, the
# linked Telegram owner chat id, and already-handled event/message ids.
[[kv_namespaces]]
binding = "JARVIS_KV"
id = "d27c42ce91a142fc951968cb2380d0ba"

# Runs the calendar-reminder check (see the `scheduled` handler) every 5
# minutes.
[triggers]
crons = ["*/5 * * * *"]
